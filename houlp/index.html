<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOULP! — home care</title>
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOULP!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5d50'/%3E%3Cpath d='M20 34 L32 22 L44 34 L44 46 L20 46 Z' fill='%23e6a23c'/%3E%3Crect x='28' y='38' width='8' height='8' fill='%232f5d50'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --eucalypt:#2f5d50;
    --eucalypt-deep:#21443a;
    --sage:#6f9a8a;
    --paper:#f3f5ef;
    --card:#ffffff;
    --honey:#e6a23c;
    --honey-deep:#bd7d1d;
    --clay:#d9744f;
    --clay-deep:#b85a38;
    --ink:#22302b;
    --muted:#6c7b74;
    --mist:#e3e9e2;
    --sage-tint:#e7efe9;
    --honey-tint:#faf0db;
    --clay-tint:#f7e6de;
    --shadow:0 1px 2px rgba(34,48,43,.06), 0 6px 20px rgba(34,48,43,.06);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .display{font-family:"Fraunces","DM Sans",Georgia,serif;font-optical-sizing:auto;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--paper)}

  /* ---------- home hero (illustration) ---------- */
  .hero{margin:-20px -16px 8px;background:var(--paper)}
  .hero-img{display:block;width:100%;height:auto;padding:8px 12px 0}
  @keyframes pop{0%{transform:scale(.99)}55%{transform:scale(1.015)}100%{transform:scale(1)}}
  .hero-img.cheer{animation:pop .55s ease}
  @media (prefers-reduced-motion: reduce){.hero-img.cheer{animation:none}}
  .status{padding:4px 22px 16px;border-bottom:1px solid var(--mist)}
  .status .greet{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
  .status .greet::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--honey);flex:0 0 auto}
  .status.warn .greet::before{background:var(--clay)}
  .status .line{font-family:"Fraunces",serif;font-size:1.5rem;line-height:1.16;margin:5px 0 5px;font-weight:600;color:var(--eucalypt)}
  .status .sub{font-size:.92rem;color:var(--muted);line-height:1.4}

  /* ---------- scroll area ---------- */
  .scroll{flex:1;overflow-y:auto;padding:20px 16px 120px;-webkit-overflow-scrolling:touch}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .section-eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
  .section-eyebrow:first-child{margin-top:4px}
  .section-eyebrow .count{background:var(--mist);color:var(--ink);border-radius:20px;padding:1px 9px;font-size:.72rem}
  .section-eyebrow.attention .count{background:var(--clay-tint);color:var(--clay-deep)}

  /* ---------- task cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--mist);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;
  }
  .task{display:flex;align-items:stretch;gap:0}
  .task-main{flex:1;padding:14px 14px 14px 16px;display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left}
  .task-top{display:flex;align-items:center;gap:8px}
  .area-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot-outdoor{background:#5aa06f}.dot-systems{background:var(--clay)}.dot-interior{background:var(--honey)}.dot-garage{background:var(--sage)}
  .task-title{font-weight:600;font-size:1.02rem;color:var(--ink);line-height:1.25}
  .task-short{font-size:.86rem;color:var(--muted);line-height:1.35}
  .task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}
  .pill{font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--sage-tint);color:var(--eucalypt)}
  .pill.due{background:var(--honey-tint);color:var(--honey-deep)}
  .pill.overdue{background:var(--clay-tint);color:var(--clay-deep)}
  .pill.soft{background:transparent;color:var(--muted);padding-left:0}
  .pill.flag{background:#fbecc8;color:#8a6314}
  .done-btn{
    flex:0 0 64px;background:var(--sage-tint);border-left:1px solid var(--mist);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--eucalypt);font-weight:600;font-size:.72rem;transition:background .15s;
  }
  .done-btn:active{background:var(--eucalypt);color:#fff}
  .done-btn svg{width:22px;height:22px}

  /* ---------- empty / caught up ---------- */
  .calm{
    text-align:center;padding:34px 20px;color:var(--muted);
    background:var(--sage-tint);border-radius:var(--radius);border:1px dashed #c6d6cd;margin-top:6px;
  }
  .calm .big{font-family:"Fraunces",serif;font-size:1.2rem;color:var(--eucalypt);margin-bottom:4px;font-weight:500}

  /* ---------- browse groups (collapsible) ---------- */
  .browse-tools{display:flex;justify-content:flex-end;margin:-2px 4px 4px}
  .linkbtn{font-size:.82rem;font-weight:600;color:var(--eucalypt);background:none;padding:6px 4px}
  .group{margin-bottom:8px}
  .group-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:12px 13px;margin-top:8px;background:var(--sage-tint);border:1px solid var(--mist);border-radius:14px}
  .group-head .g-emoji{font-size:1.05rem;flex:0 0 auto}
  .group-head .g-title{font-family:"Fraunces",serif;font-size:1.1rem;font-weight:600;flex:1;color:var(--ink)}
  .group-head .g-due{font-size:.72rem;font-weight:700;color:var(--clay-deep);background:var(--clay-tint);border-radius:20px;padding:1px 8px}
  .group-head .g-count{font-size:.76rem;color:var(--muted);background:var(--card);border:1px solid var(--mist);border-radius:20px;padding:1px 9px}
  .group-head .g-chev{flex:0 0 auto;color:var(--muted);transition:transform .25s}
  .group-head[aria-expanded="false"] .g-chev{transform:rotate(-90deg)}
  .group-body{overflow:hidden;max-height:2400px;transition:max-height .32s ease;padding-top:9px}
  .group-body.collapsed{max-height:0;padding-top:0}
  .browse-row{
    display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
    border:1px solid var(--mist);border-radius:14px;margin-bottom:9px;box-shadow:var(--shadow);
    text-align:left;width:100%;
  }
  .browse-row .br-body{flex:1;min-width:0}
  .browse-row .br-title{font-weight:600;font-size:.98rem}
  .browse-row .br-sub{font-size:.82rem;color:var(--muted)}
  .chev{flex:0 0 auto;color:var(--mist)}

  /* ---------- history ---------- */
  .hist-month{font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;margin:22px 4px 10px;color:var(--eucalypt)}
  .hist-month:first-child{margin-top:4px}
  .hist-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--mist);border-radius:13px;margin-bottom:8px;box-shadow:var(--shadow)}
  .hist-row .h-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:.9rem}
  .hist-row .h-body{flex:1;min-width:0}
  .hist-row .h-title{font-weight:600;font-size:.92rem}
  .hist-row .h-when{font-size:.8rem;color:var(--muted)}
  .hist-row .h-by{font-size:.74rem;color:var(--sage);font-weight:600}

  /* ---------- setup ---------- */
  .panel{background:var(--card);border:1px solid var(--mist);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 16px;margin-bottom:16px}
  .panel-title{font-family:"Fraunces",serif;font-size:1.05rem;font-weight:600;margin:14px 0 4px}
  .panel-note{font-size:.84rem;color:var(--muted);margin:0 0 14px}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--mist)}
  .toggle-row:first-of-type{border-top:none}
  .toggle-row .t-label{font-weight:500;font-size:.95rem}
  .toggle-row .t-desc{font-size:.78rem;color:var(--muted)}
  .switch{position:relative;width:48px;height:28px;flex:0 0 48px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--mist);border-radius:20px;transition:.2s}
  .slider::before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--eucalypt)}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .field{width:100%;padding:12px 14px;border:1px solid var(--mist);border-radius:12px;font-size:1rem;font-family:inherit;background:var(--paper);color:var(--ink);margin:6px 0 14px}
  .field:focus{outline:2px solid var(--sage);outline-offset:1px}
  .btn{display:block;width:100%;padding:14px;border-radius:13px;font-weight:600;font-size:.96rem;text-align:center;margin:8px 0}
  .btn-primary{background:var(--honey);color:#3a2a05}
  .btn-primary:active{background:var(--honey-deep);color:#fff}
  .btn-ghost{background:var(--sage-tint);color:var(--eucalypt)}
  .btn-quiet{background:transparent;color:var(--clay-deep);font-size:.86rem}
  .btn-row{display:flex;gap:10px}.btn-row .btn{margin:8px 0}

  /* ---------- bottom nav ---------- */
  .nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--mist);
    display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:30;
  }
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.7rem;font-weight:600;padding:4px}
  .nav button svg{width:23px;height:23px}
  .nav button.active{color:var(--eucalypt)}
  .nav .nav-badge{position:absolute;margin-left:16px;margin-top:-3px;min-width:16px;height:16px;background:var(--clay);color:#fff;border-radius:9px;font-size:.62rem;line-height:16px;text-align:center;padding:0 4px;font-weight:700}

  /* ---------- sheet (task detail) ---------- */
  .sheet-scrim{position:fixed;inset:0;background:rgba(20,30,26,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:480px;
    background:var(--paper);border-radius:24px 24px 0 0;z-index:41;transition:transform .3s cubic-bezier(.2,.8,.2,1);
    max-height:90vh;display:flex;flex-direction:column;
  }
  .sheet.open{transform:translateX(-50%) translateY(0)}
  .sheet-grip{width:38px;height:4px;background:var(--mist);border-radius:4px;margin:10px auto 4px}
  .sheet-body{overflow-y:auto;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px)}
  .sheet-area{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
  .sheet-title{font-family:"Fraunces",serif;font-size:1.5rem;font-weight:600;line-height:1.15;margin:6px 0 8px}
  .sheet-short{font-size:.98rem;color:var(--ink);margin-bottom:14px}
  .meta-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .howto-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--sage-tint);color:var(--eucalypt);font-weight:600;padding:13px 16px;border-radius:13px;font-size:.95rem}
  .howto{overflow:hidden;max-height:0;transition:max-height .3s ease}
  .howto.open{max-height:1400px}
  .howto-inner{padding:14px 4px 4px}
  .step{display:flex;gap:12px;margin-bottom:13px}
  .step-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--eucalypt);color:#fff;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .step-txt{flex:1;font-size:.92rem;padding-top:2px}
  .note-box{background:var(--honey-tint);border:1px solid #ecd9a8;border-radius:12px;padding:12px 14px;font-size:.86rem;margin:14px 0;color:#6b4e12}
  .note-box b{color:#4d3808}
  .note-box.safety{background:var(--clay-tint);border-color:#e6c4b4;color:var(--clay-deep)}
  .sheet-actions{margin-top:18px}
  .freq-edit{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);margin-top:14px;justify-content:center}
  .freq-edit select{font-family:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--mist);border-radius:8px;background:var(--paper);color:var(--ink)}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:96px;background:var(--eucalypt-deep);color:#fff;padding:11px 18px;border-radius:30px;font-size:.9rem;font-weight:500;z-index:60;opacity:0;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .tiny-print{font-size:.76rem;color:var(--muted);text-align:center;padding:8px 16px 0;line-height:1.5}
  .add-custom{margin-top:6px}
</style>
</head>
<body>
<div class="app">

  <div class="scroll" id="scroll">

    <!-- HOME -->
    <section class="view active" id="view-home"></section>

    <!-- BROWSE -->
    <section class="view" id="view-browse"></section>

    <!-- HISTORY -->
    <section class="view" id="view-history"></section>

    <!-- SETUP -->
    <section class="view" id="view-setup"></section>

  </div>

  <!-- NAV -->
  <nav class="nav">
    <button data-nav="home" class="active" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      This week
    </button>
    <button data-nav="browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor"/></svg>
      Everything
    </button>
    <button data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3"/><polyline points="3 3 3 7 7 7"/><polyline points="12 7 12 12 15 14"/></svg>
      Done
    </button>
    <button data-nav="setup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-2.92.99V21a2 2 0 11-4 0v-.09A1.65 1.65 0 006 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 003.6 14a1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 003.6 7.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.6V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0021 9.4z"/></svg>
      Set up
    </button>
  </nav>

  <!-- DETAIL SHEET -->
  <div class="sheet-scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>

/* ---------- 1. STORAGE MODULE (the future swap point) ---------- */
const Store = (() => {
  const KEY = "houlp.v1";
  const LEGACY_KEY = "burrow.v1";   // read old data once if present, then it saves under the new key
  let mem = null;               // in-memory fallback if localStorage is blocked
  let usingMem = false;
  function load(){
    try{
      const raw = localStorage.getItem(KEY) || localStorage.getItem(LEGACY_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ usingMem = true; return mem; }
  }
  function save(state){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
    }catch(e){ usingMem = true; mem = state; }
  }
  function isEphemeral(){ return usingMem; }
  return { load, save, isEphemeral };
  /*  TO MIGRATE TO SUPABASE LATER:
      - load()  -> fetch the household row(s) for the logged-in user
      - save()  -> upsert the same data
      Keep the same shape (see State below) and the rest of the app is unchanged. */
})();

/* ---------- 2. DATE HELPERS ---------- */
const DAY = 86400000;
function todayISO(){ const d = new Date(); d.setHours(0,0,0,0); return iso(d); }
function iso(d){ return d.toISOString().slice(0,10); }
function parse(s){ const d = new Date(s+"T00:00:00"); return d; }
function addDays(isoStr, n){ const d = parse(isoStr); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/DAY); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function relDue(dueISO){
  const d = daysBetween(todayISO(), dueISO);
  if(d < -1) return {txt:`${-d} days overdue`, cls:"overdue"};
  if(d === -1) return {txt:"Overdue since yesterday", cls:"overdue"};
  if(d === 0) return {txt:"Due today", cls:"due"};
  if(d === 1) return {txt:"Due tomorrow", cls:"due"};
  if(d <= 7) return {txt:`Due in ${d} days`, cls:"due"};
  if(d <= 31) return {txt:`In about ${Math.round(d/7)} weeks`, cls:""};
  return {txt:`In ${Math.round(d/30)} months`, cls:""};
}

/* ---------- 6. STATE ---------- */
let State = null;
function freshState(){
  const features = {};
  FEATURES.forEach(f => features[f.key] = f.def);
  return {
    version:1,
    setupDone:false,
    companionName:"Pip",
    yourName:"",
    features,
    tasks:{},      // id -> { due, lastDone, freqDays(override|null), enabled }
    custom:[],     // user-added task defs
    history:[],    // { id, title, area, date, by }
    snoozeDays:3,
    ui:{ browseCollapsed:{} }
  };
}

function allTaskDefs(){ return TASKS.concat(State.custom); }
function getDef(id){ return allTaskDefs().find(t => t.id === id); }
function featureOn(def){
  if(!def.requires || !def.requires.length) return true;
  return def.requires.every(k => State.features[k]);
}
function freqDaysFor(id){
  const t = State.tasks[id];
  if(t && t.freqDays) return t.freqDays;
  const d = getDef(id);
  return d ? d.freqDays : 30;
}

/* build / refresh the per-task schedule when setup runs or features change */
function syncTasks(){
  const today = todayISO();
  allTaskDefs().forEach(def => {
    const on = featureOn(def);
    let t = State.tasks[def.id];
    if(on && !t){
      // first time we see this task: stagger its first due date within one interval
      const offset = hashStr(def.id) % Math.max(1, def.freqDays);
      State.tasks[def.id] = { due: addDays(today, offset), lastDone:null, freqDays:null, enabled:true };
    } else if(t){
      t.enabled = on;
    }
  });
}

/* ---------- 7. SCHEDULE QUERIES ---------- */
function activeTasks(){
  return allTaskDefs()
    .filter(def => { const t = State.tasks[def.id]; return t && t.enabled; })
    .map(def => ({ def, st: State.tasks[def.id] }));
}
function buckets(){
  const today = todayISO();
  const out = { overdue:[], week:[], soon:[] };
  activeTasks().forEach(item => {
    const d = daysBetween(today, item.st.due);
    if(d < 0) out.overdue.push(item);
    else if(d <= 7) out.week.push(item);
    else if(d <= 31) out.soon.push(item);
  });
  const byDue = (a,b) => a.st.due < b.st.due ? -1 : 1;
  out.overdue.sort(byDue); out.week.sort(byDue); out.soon.sort(byDue);
  return out;
}

/* ---------- 8. ACTIONS ---------- */
function markDone(id){
  const today = todayISO();
  const def = getDef(id);
  const t = State.tasks[id];
  if(!t || !def) return;
  t.lastDone = today;
  t.due = addDays(today, freqDaysFor(id));
  State.history.unshift({ id, title:def.title, area:def.area, date:today, by: State.yourName || "" });
  if(State.history.length > 400) State.history.length = 400;
  persist();
  render();
  cheer();
  toast(`Nice — ${def.title.toLowerCase()} done ✓`);
}
function snooze(id){
  const t = State.tasks[id];
  if(!t) return;
  t.due = addDays(todayISO(), State.snoozeDays);
  persist(); toast(`Snoozed ${State.snoozeDays} days`); closeSheet(); render();
}
function skipCycle(id){
  const t = State.tasks[id];
  if(!t) return;
  t.due = addDays(todayISO(), freqDaysFor(id));
  persist(); toast("Skipped to next time"); closeSheet(); render();
}
function setFreq(id, days){
  const t = State.tasks[id];
  if(!t) return;
  t.freqDays = days;
  if(t.lastDone) t.due = addDays(t.lastDone, days);
  persist(); render(); openSheet(id);
}

function persist(){ Store.save(State); }

/* ---------- 9. STATUS LINE ---------- */

function companionState(){
  const b = buckets();
  const o = b.overdue.length, w = b.week.length;
  if(!State.setupDone){
    return { warn:false, greet:"Welcome home", line:"Let's get your place set up.", sub:"Tell me what your home has and I'll build your list." };
  }
  if(o === 0 && w === 0){
    return { warn:false, greet:"All looked after", line:"Nothing needs you right now.", sub:"Your place is in good shape — go enjoy it." };
  }
  if(o === 0){
    return { warn:false, greet:"You're on top of it", line:`${w} thing${w>1?"s":""} coming up this week.`, sub:"No rush — nothing's overdue yet." };
  }
  if(o <= 2){
    return { warn:true, greet:"A couple to catch", line:`${o} thing${o>1?"s are":" is"} a little overdue.`, sub:"Knock one over when you get a sec — start with the quickest." };
  }
  return { warn:true, greet:"Let's chip away", line:`${o} things have slipped.`, sub:"Pick just one to start — you'll feel better instantly." };
}

function heroHTML(){
  const cs = companionState();
  return `<div class="hero">
    <img class="hero-img" id="heroImg" src="${HERO_SRC}" alt="Illustration of a busy, well-kept home — laundry, repairs, plants, a garage and a pool">
    <div class="status${cs.warn?" warn":""}">
      <div class="greet">Your place</div>
      <div class="line">${cs.line}</div>
      <div class="sub">${cs.sub}</div>
    </div>
  </div>`;
}
function cheer(){
  const img = document.getElementById("heroImg");
  if(!img) return;
  img.classList.remove("cheer"); void img.offsetWidth; img.classList.add("cheer");
}

/* ---------- 10. RENDER: HOME ---------- */
function taskCard(item){
  const { def, st } = item;
  const a = AREAS[def.area];
  const rd = relDue(st.due);
  const flags = [];
  if(def.safety) flags.push(`<span class="pill flag">Safety</span>`);
  return `
  <div class="card">
    <div class="task">
      <button class="task-main" data-open="${def.id}">
        <div class="task-top">
          <span class="area-dot ${a.dot}"></span>
          <span class="task-title">${def.title}</span>
        </div>
        <div class="task-short">${def.short}</div>
        <div class="task-meta">
          <span class="pill ${rd.cls}">${rd.txt}</span>
          ${flags.join("")}
        </div>
      </button>
      <button class="done-btn" data-done="${def.id}" aria-label="Mark done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Done
      </button>
    </div>
  </div>`;
}

function renderHome(){
  const el = document.getElementById("view-home");
  if(!State.setupDone){
    el.innerHTML = heroHTML() + `
      <div class="calm">
        <div class="big">Welcome home</div>
        <div>Head to <b>Set up</b> and tell me what your place has. I'll build a gentle maintenance list and only ever show what's actually due.</div>
        <button class="btn btn-primary" data-nav="setup" style="margin-top:16px">Set up my home</button>
      </div>`;
    return;
  }
  const b = buckets();
  let html = heroHTML();

  if(b.overdue.length){
    html += `<div class="section-eyebrow attention">Overdue <span class="count">${b.overdue.length}</span></div>`;
    html += b.overdue.map(taskCard).join("");
  }
  if(b.week.length){
    html += `<div class="section-eyebrow">Due this week <span class="count">${b.week.length}</span></div>`;
    html += b.week.map(taskCard).join("");
  }
  if(!b.overdue.length && !b.week.length){
    html += `<div class="calm"><div class="big">All caught up ✓</div><div>Nothing's due this week. Your next jobs are under <b>Everything</b> whenever you're curious.</div></div>`;
  }
  if(b.soon.length){
    html += `<div class="section-eyebrow">Coming up <span class="count">${b.soon.length}</span></div>`;
    html += b.soon.slice(0,6).map(taskCard).join("");
    if(b.soon.length > 6) html += `<div class="tiny-print">+ ${b.soon.length-6} more in the next month — see <b>Everything</b>.</div>`;
  }
  el.innerHTML = html;
}

/* ---------- 11. RENDER: BROWSE ---------- */
function renderBrowse(){
  const el = document.getElementById("view-browse");
  if(!State.ui) State.ui = { browseCollapsed:{} };
  const today = todayISO();

  const groups = Object.keys(AREAS).map(areaKey => ({
    areaKey, a: AREAS[areaKey],
    items: activeTasks().filter(i => i.def.area === areaKey).sort((x,y)=> x.st.due<y.st.due?-1:1)
  })).filter(g => g.items.length);

  if(!groups.length){ el.innerHTML = `<div class="calm">No tasks yet — finish <b>Set up</b> first.</div>`; return; }

  const anyOpen = groups.some(g => !State.ui.browseCollapsed[g.areaKey]);
  let html = `<div class="browse-tools"><button class="linkbtn" data-browseall="1">${anyOpen?"Collapse all":"Expand all"}</button></div>`;

  groups.forEach(g => {
    const collapsed = !!State.ui.browseCollapsed[g.areaKey];
    const dueCount = g.items.filter(i => daysBetween(today, i.st.due) <= 7).length;
    const rows = g.items.map(i => {
      const rd = relDue(i.st.due);
      return `<button class="browse-row" data-open="${i.def.id}">
        <span class="area-dot ${g.a.dot}"></span>
        <span class="br-body"><span class="br-title">${i.def.title}</span><br><span class="br-sub">${i.def.freqLabel} · ${rd.txt}</span></span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>`;
    }).join("");
    html += `<div class="group">
      <button class="group-head" data-toggle="${g.areaKey}" aria-expanded="${!collapsed}">
        <span class="g-emoji">${g.a.emoji}</span>
        <span class="g-title">${g.a.name}</span>
        ${dueCount?`<span class="g-due">${dueCount} due</span>`:""}
        <span class="g-count">${g.items.length}</span>
        <svg class="g-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="group-body${collapsed?" collapsed":""}">${rows}</div>
    </div>`;
  });

  html += `<button class="btn btn-ghost add-custom" data-addcustom="1" style="margin-top:18px">+ Add your own task</button>`;
  el.innerHTML = html;
}

function toggleBrowseGroup(area, headBtn){
  if(!State.ui) State.ui = { browseCollapsed:{} };
  const collapsed = !State.ui.browseCollapsed[area];
  State.ui.browseCollapsed[area] = collapsed;
  persist();
  headBtn.setAttribute("aria-expanded", String(!collapsed));
  const body = headBtn.nextElementSibling;
  if(body) body.classList.toggle("collapsed", collapsed);
  const tools = document.querySelector("[data-browseall]");
  if(tools){
    const anyOpen = Object.keys(AREAS).some(k => activeTasks().some(i=>i.def.area===k) && !State.ui.browseCollapsed[k]);
    tools.textContent = anyOpen ? "Collapse all" : "Expand all";
  }
}

function toggleBrowseAll(){
  if(!State.ui) State.ui = { browseCollapsed:{} };
  const areas = Object.keys(AREAS).filter(k => activeTasks().some(i=>i.def.area===k));
  const anyOpen = areas.some(k => !State.ui.browseCollapsed[k]);
  areas.forEach(k => State.ui.browseCollapsed[k] = anyOpen);
  persist();
  renderBrowse();
}

/* ---------- 12. RENDER: HISTORY ---------- */
function monthLabel(isoStr){
  const d = parse(isoStr);
  return d.toLocaleDateString("en-AU",{month:"long",year:"numeric"});
}
function renderHistory(){
  const el = document.getElementById("view-history");
  if(!State.history.length){
    el.innerHTML = `<div class="calm"><div class="big">Nothing logged yet</div><div>Every time you tap <b>Done</b>, it lands here — a quiet record of everything you've kept on top of.</div></div>`;
    return;
  }
  let html = "", lastMonth = "";
  State.history.forEach(h => {
    const m = monthLabel(h.date);
    if(m !== lastMonth){ html += `<div class="hist-month">${m}</div>`; lastMonth = m; }
    const a = AREAS[h.area] || AREAS.interior;
    const when = parse(h.date).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
    html += `<div class="hist-row">
      <span class="h-icon" style="background:${a.tint}">${a.emoji}</span>
      <span class="h-body"><span class="h-title">${h.title}</span><br><span class="h-when">${when}</span></span>
      ${h.by?`<span class="h-by">${h.by}</span>`:""}
    </div>`;
  });
  el.innerHTML = html;
}

/* ---------- 13. RENDER: SETUP ---------- */
function renderSetup(){
  const el = document.getElementById("view-setup");
  const toggles = FEATURES.map(f => `
    <div class="toggle-row">
      <div><div class="t-label">${f.label}</div>${f.desc?`<div class="t-desc">${f.desc}</div>`:""}</div>
      <label class="switch"><input type="checkbox" data-feat="${f.key}" ${State.features[f.key]?"checked":""}><span class="slider"></span></label>
    </div>`).join("");

  el.innerHTML = `
    <div class="panel">
      <div class="panel-title">Who's using this?</div>
      <p class="panel-note">Optional — your name gets logged against jobs you finish. (Handy once you share this with someone.)</p>
      <input class="field" id="youField" value="${State.yourName||""}" placeholder="Your name (optional)" maxlength="18">
    </div>

    <div class="panel">
      <div class="panel-title">What does your home have?</div>
      <p class="panel-note">Flip these to match your place. Tasks for anything switched off just disappear — re-run this anytime when things change.</p>
      ${toggles}
    </div>

    <div class="panel">
      <div class="panel-title">Backup & restore</div>
      <p class="panel-note">Your data lives in this browser only. Export a backup before changing phones or clearing data — then import it on the new device.</p>
      <button class="btn btn-ghost" data-export="1">Export a backup file</button>
      <button class="btn btn-ghost" data-import="1">Import a backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>

    <div class="panel">
      <div class="panel-title">Start fresh</div>
      <p class="panel-note">Wipes everything and resets the seeded list.</p>
      <button class="btn btn-quiet" data-reset="1">Reset all data</button>
    </div>

    ${Store.isEphemeral()?`<div class="note-box"><b>Heads up:</b> this browser is blocking local storage (common inside a preview pane). Your changes won't be saved between refreshes here. Open the downloaded file directly, or host it, and saving works normally.</div>`:""}

    <p class="tiny-print">HOULP! gives general guidance for an Australian home. For anything with legal weight — pool fencing &amp; registration, smoke alarms, electrical and gas work — always confirm current NSW rules and use a licensed professional. When in doubt, get a pro.</p>

    <p class="tiny-print">HOULP! is a personal project by Katie Morrison, built with AI as a single self-contained HTML file that works entirely offline. Your data stays in your browser. More at <a href="https://kmorrison.dev/" target="_blank" rel="noopener">kmorrison.dev</a>.</p>
  `;
}

/* ---------- 14. DETAIL SHEET ---------- */
let sheetId = null;
function openSheet(id){
  const def = getDef(id), st = State.tasks[id];
  if(!def || !st) return;
  sheetId = id;
  const a = AREAS[def.area];
  const rd = relDue(st.due);
  const steps = (def.steps||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-txt">${s}</div></div>`).join("");
  const lastDone = st.lastDone ? `Last done ${parse(st.lastDone).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}` : "Not done yet";
  const curFreq = freqDaysFor(id);
  const freqOpts = [[7,"Weekly"],[14,"Fortnightly"],[30,"Monthly"],[90,"Quarterly"],[180,"Twice a year"],[365,"Yearly"]];
  const freqSelect = `<select id="freqSel">${freqOpts.map(o=>`<option value="${o[0]}" ${o[0]===curFreq?"selected":""}>${o[1]}</option>`).join("")}</select>`;

  let notes = "";
  if(def.safety) notes += `<div class="note-box safety">⚠️ <b>Safety:</b> ${def.note || "Take care — stop and call a professional if it feels beyond a simple job."}</div>`;
  else if(def.note) notes += `<div class="note-box">ℹ️ ${def.note}</div>`;
  if(def.legal && !def.safety) notes += `<div class="note-box">⚖️ ${def.note || "This has legal requirements in NSW — verify current rules."}</div>`;

  document.getElementById("sheetBody").innerHTML = `
    <div class="sheet-area"><span class="area-dot ${a.dot}"></span>${a.name}</div>
    <div class="sheet-title">${def.title}</div>
    <div class="sheet-short">${def.short}</div>
    <div class="meta-strip">
      <span class="pill ${rd.cls}">${rd.txt}</span>
      <span class="pill soft">${lastDone}</span>
    </div>
    ${steps?`<button class="howto-toggle" id="howtoToggle"><span>Show me how</span><svg id="howtoChev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
    <div class="howto" id="howto"><div class="howto-inner">${steps}</div></div>`:""}
    ${notes}
    <div class="sheet-actions">
      <button class="btn btn-primary" data-done="${id}">Mark it done</button>
      <div class="btn-row">
        <button class="btn btn-ghost" data-snooze="${id}">Snooze ${State.snoozeDays} days</button>
        <button class="btn btn-ghost" data-skip="${id}">Skip this time</button>
      </div>
    </div>
    <div class="freq-edit">How often? ${freqSelect}</div>
    ${def.custom?`<button class="btn btn-quiet" data-delcustom="${id}">Delete this task</button>`:""}
  `;
  document.getElementById("scrim").classList.add("open");
  document.getElementById("sheet").classList.add("open");

  const ht = document.getElementById("howtoToggle");
  if(ht){ ht.onclick = () => {
    const box = document.getElementById("howto");
    const chev = document.getElementById("howtoChev");
    box.classList.toggle("open");
    chev.style.transform = box.classList.contains("open") ? "rotate(180deg)" : "";
    ht.querySelector("span").textContent = box.classList.contains("open") ? "Hide steps" : "Show me how";
  };}
  const fs = document.getElementById("freqSel");
  if(fs){ fs.onchange = () => setFreq(id, parseInt(fs.value,10)); }
}
function closeSheet(){
  sheetId = null;
  document.getElementById("scrim").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
}

/* ---------- 15. ADD / DELETE CUSTOM ---------- */
function addCustom(){
  const title = prompt("What's the task? (e.g. Clean the fish pond filter)");
  if(!title) return;
  const areaKeys = Object.keys(AREAS);
  const areaName = prompt("Which area?  outdoor / systems / interior / garage", "interior");
  const area = areaKeys.includes((areaName||"").trim()) ? areaName.trim() : "interior";
  const everyDays = parseInt(prompt("How often, in days? (7=weekly, 30=monthly, 90=quarterly, 365=yearly)", "30"),10) || 30;
  const id = "custom-" + Date.now();
  State.custom.push({ id, area, title, short:"Your own reminder.", freqDays:everyDays, freqLabel:`Every ${everyDays} days`, requires:[], steps:[], custom:true });
  syncTasks(); persist(); render(); toast("Added ✓");
}
function delCustom(id){
  State.custom = State.custom.filter(c => c.id !== id);
  delete State.tasks[id];
  persist(); closeSheet(); render(); toast("Deleted");
}

/* ---------- 16. BACKUP ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(State,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `houlp-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Backup downloaded");
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !data.version){ toast("That doesn't look like a HOULP! backup"); return; }
      State = data; syncTasks(); persist(); render(); toast("Restored ✓");
    }catch(e){ toast("Couldn't read that file"); }
  };
  reader.readAsText(file);
}

/* ---------- 17. NAV + RENDER ---------- */
let currentView = "home";
function go(view){
  currentView = view;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-"+view).classList.add("active");
  document.querySelectorAll(".nav button[data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav===view));
  document.getElementById("scroll").scrollTop = 0;
  render();
}
function render(){
  if(currentView==="home") renderHome();
  else if(currentView==="browse") renderBrowse();
  else if(currentView==="history") renderHistory();
  else if(currentView==="setup") renderSetup();
  // overdue badge on the nav
  const b = buckets();
  const homeBtn = document.getElementById("nav-home");
  homeBtn.querySelector(".nav-badge")?.remove();
  if(b.overdue.length){
    const badge = document.createElement("span");
    badge.className = "nav-badge"; badge.textContent = b.overdue.length;
    homeBtn.appendChild(badge);
  }
}

/* ---------- 18. TOAST ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}

/* ---------- 19. EVENTS (delegated) ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-nav],[data-open],[data-done],[data-snooze],[data-skip],[data-export],[data-import],[data-reset],[data-addcustom],[data-delcustom],[data-feat],[data-toggle],[data-browseall]");
  if(!t) return;
  if(t.dataset.nav){ go(t.dataset.nav); }
  else if(t.dataset.toggle){ toggleBrowseGroup(t.dataset.toggle, t); }
  else if(t.dataset.browseall){ toggleBrowseAll(); }
  else if(t.dataset.open){ openSheet(t.dataset.open); }
  else if(t.dataset.done){ const id=t.dataset.done; if(sheetId) closeSheet(); markDone(id); }
  else if(t.dataset.snooze){ snooze(t.dataset.snooze); }
  else if(t.dataset.skip){ skipCycle(t.dataset.skip); }
  else if(t.dataset.export){ exportBackup(); }
  else if(t.dataset.import){ document.getElementById("importFile").click(); }
  else if(t.dataset.reset){ if(confirm("Reset everything and start fresh?")){ State=freshState(); State.setupDone=true; syncTasks(); persist(); go("home"); } }
  else if(t.dataset.addcustom){ addCustom(); }
  else if(t.dataset.delcustom){ delCustom(t.dataset.delcustom); }
});
document.addEventListener("change", (e) => {
  if(e.target.matches("[data-feat]")){
    State.features[e.target.dataset.feat] = e.target.checked;
    if(!State.setupDone) State.setupDone = true;
    syncTasks(); persist(); render();
  }
  if(e.target.id==="importFile" && e.target.files[0]){ importBackup(e.target.files[0]); }
});
document.addEventListener("input", (e) => {
  if(e.target.id==="youField"){ State.yourName = e.target.value.trim(); persist(); }
});
document.getElementById("scrim").addEventListener("click", closeSheet);

/* ---------- 20. INSTALLABLE (single-file manifest) ---------- */
(function(){
  try{
    const manifest = {
      name:"HOULP! — home care", short_name:"HOULP!",
      start_url:".", display:"standalone",
      background_color:"#f3f5ef", theme_color:"#2f5d50",
      icons:[{ src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5d50'/%3E%3Cpath d='M20 34 L32 22 L44 34 L44 46 L20 46 Z' fill='%23e6a23c'/%3E%3Crect x='28' y='38' width='8' height='8' fill='%232f5d50'/%3E%3C/svg%3E", sizes:"any", type:"image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){}
})();

/* ---------- 21. BOOT ---------- */
function boot(){
  const saved = Store.load();
  State = saved || freshState();
  if(saved && !saved.version) State = freshState(); // guard old/garbled data
  if(!State.ui) State.ui = { browseCollapsed:{} };
  syncTasks();
  // first-ever launch lands on setup; returning users land on home
  if(!State.setupDone){ render(); go("setup"); }
  else { go("home"); }
}
boot();
</script>
</body>
</html>
