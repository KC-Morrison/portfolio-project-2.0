<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Gym Coach</title>
    <meta name="description" content="A pocket workout tracker in a single HTML file: a full program, personal bests, streaks, and Pebble the accountability pet rock.">
    <link rel="canonical" href="https://kmorrison.dev/gym-coach/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FAF5EE'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23B4552D' text-anchor='middle'%3EKM%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        // Apply a saved theme choice before the page paints (no flash). Separate from workout data.
        try {
            var savedTheme = localStorage.getItem('gymTheme');
            if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {}
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── THEME TOKENS ──
           Dark is the default. Light (warm cream) applies when the phone is in
           light mode, or when the toggle forces it. The toggle stores its choice
           under 'gymTheme', separate from workout data. */
        :root {
            --bg:        #0D0D0D;
            --grain:     rgba(255,255,255,0.022);
            --s1:        #1A1A1A;
            --s2:        #222222;
            --s3:        #2A2A2A;
            --field:     #2E2E2E;
            --field-border: rgba(237,237,234,0.40);
            --border:    #2E2E2E;
            --border2:   rgba(237,237,234,0.20);
            --accent:    #FF5F1F;
            --accent-text: #FF5F1F;
            --accent-ink: #0D0D0D;
            --accent-dim: rgba(255,95,31,0.14);
            --text:      #EDEDEA;
            --muted:     #9A9A96;
            --muted2:    #85857F;
            --shadow:    inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 4px rgba(0,0,0,0.5), 0 10px 24px rgba(0,0,0,0.55);
            --shadow-sm: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.45);
            --radius:    2px;
            --font-display: 'Inter Tight', sans-serif;
            --font-body:    'Inter Tight', sans-serif;
            --font-mono:    'JetBrains Mono', monospace;
            color-scheme: dark;
        }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg:        #ECE7DE;
                --grain:     rgba(0,0,0,0.03);
                --s1:        #F8F5F0;
                --s2:        #F1ECE4;
                --s3:        #FFFFFF;
                --field:     #FFFFFF;
                --field-border: rgba(40,28,16,0.30);
                --border:    #DCD5C9;
                --border2:   rgba(40,28,16,0.22);
                --accent-text: #B8431A;
                --accent-ink: #121110;
                --accent-dim: rgba(255,95,31,0.12);
                --text:      #121110;
                --muted:     #5E5850;
                --muted2:    #6F685F;
                --shadow:    inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 4px rgba(40,28,16,0.08), 0 10px 24px rgba(40,28,16,0.12);
                --shadow-sm: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(40,28,16,0.08), 0 4px 12px rgba(40,28,16,0.10);
                color-scheme: light;
            }
        }
        :root[data-theme="light"] {
            --bg:        #ECE7DE;
            --grain:     rgba(0,0,0,0.03);
            --s1:        #F8F5F0;
            --s2:        #F1ECE4;
            --s3:        #FFFFFF;
            --field:     #FFFFFF;
            --field-border: rgba(40,28,16,0.30);
            --border:    #DCD5C9;
            --border2:   rgba(40,28,16,0.22);
            --accent-text: #B8431A;
            --accent-ink: #121110;
            --accent-dim: rgba(255,95,31,0.12);
            --text:      #121110;
            --muted:     #5E5850;
            --muted2:    #6F685F;
            --shadow:    inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 4px rgba(40,28,16,0.08), 0 10px 24px rgba(40,28,16,0.12);
            --shadow-sm: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(40,28,16,0.08), 0 4px 12px rgba(40,28,16,0.10);
            color-scheme: light;
        }

        html { background: var(--bg); }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            background-image: repeating-linear-gradient(0deg, var(--grain) 0 1px, transparent 1px 3px);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* shared mono caption style */
        .mood-badge, .theme-toggle, .card-last, .set-num, .sets-header span, .field label,
        .history-title, .history-count, .h-date, .data-title, .best-label, .pet-rock-name, .pet-rock-mood {
            font-family: var(--font-mono);
        }

        /* ── HEADER ── */
        .app-header {
            padding: 52px 16px 18px;
            position: relative;
            overflow: hidden;
        }

        .header-top {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .app-title {
            font-family: var(--font-display);
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: var(--text);
        }
        .app-title .pop { color: var(--accent-text); }

        .header-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-top: 4px;
        }

        .mood-badge {
            background: var(--s1);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 4px 8px;
            font-size: 0.62rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        .theme-toggle {
            min-height: 32px;
            padding: 0 10px;
            background: transparent;
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            color: var(--muted);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle:active { color: var(--accent-text); border-color: var(--accent); }

        .header-line {
            position: relative;
            height: 1px;
            background: var(--border2);
            margin-top: 14px;
        }
        .header-line::before {
            content: '';
            position: absolute;
            left: 0; top: -1px;
            width: 48px; height: 3px;
            background: var(--accent);
        }

        /* ── CARD LIST ── */
        .card-list { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 8px; }

        .card {
            background: var(--s1);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: border-color 0.2s, transform 0.1s;
        }
        .card:active { transform: scale(0.995); }
        .card.open { border-color: var(--border2); box-shadow: var(--shadow); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 14px 14px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .card-label { flex: 1; min-width: 0; }
        .card-name {
            font-family: var(--font-display);
            font-size: 1.02rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.1;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }
        .card-last {
            font-size: 0.66rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 4px;
        }
        .card-last .val { color: var(--accent-text); font-weight: 700; }

        .card-chevron {
            width: 26px;
            height: 26px;
            border-radius: var(--radius);
            border: 1px solid var(--border2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.28s ease;
            font-size: 0.6rem;
            color: var(--muted);
        }
        .card.open .card-chevron {
            transform: rotate(180deg);
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        /* ── BODY ── */
        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.38s cubic-bezier(0.4,0,0.2,1);
        }
        .card-body.open { max-height: 1200px; }

        .card-inner {
            padding: 14px 14px 18px;
            border-top: 1px solid var(--border);
        }

        /* ── INSTRUCTIONS ── */
        .instructions {
            font-size: 0.86rem;
            font-weight: 500;
            color: var(--muted);
            line-height: 1.55;
            margin-bottom: 14px;
        }

        /* ── LAST SESSION: the orange hero tile ── */
        .best-box {
            position: relative;
            background: var(--accent);
            color: var(--accent-ink);
            border-radius: var(--radius);
            padding: 12px 14px 12px 12px;
            margin-bottom: 14px;
            display: flex;
            gap: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .best-box::before, .best-box::after {
            content: '';
            position: absolute;
            right: 6px;
            width: 10px; height: 10px;
            border: 0 solid currentColor;
            opacity: 0.55;
        }
        .best-box::before { top: 6px; border-top-width: 1px; border-right-width: 1px; }
        .best-box::after  { bottom: 6px; border-bottom-width: 1px; border-right-width: 1px; }
        .best-side {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 150px;
            font-family: var(--font-display);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            border-left: 1px solid rgba(0,0,0,0.35);
            padding-left: 8px;
            text-align: right;
            flex-shrink: 0;
        }
        .best-text { flex: 1; min-width: 0; }
        .best-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .best-hero {
            font-family: var(--font-display);
            font-size: 4.4rem;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.05em;
            overflow-wrap: anywhere;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0 8px;
        }
        .best-hero.long { font-size: 3rem; }
        .best-unit {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0;
        }
        .best-val {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 2px 8px;
            align-items: baseline;
        }
        .best-set + .best-set::before {
            content: '/';
            opacity: 0.5;
            margin-right: 8px;
            font-weight: 400;
        }
        .best-date {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ── FORM ── */
        .log-form { display: flex; flex-direction: column; gap: 9px; }

        /* Sets list */
        .sets-list { display: flex; flex-direction: column; gap: 6px; }
        .set-row {
            display: grid;
            grid-template-columns: 36px 1fr 1fr 36px;
            gap: 6px;
            align-items: center;
        }
        .set-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
            text-align: center;
        }
        .set-row input {
            width: 100%;
            background: var(--field);
            border: 1px solid var(--field-border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            padding: 10px 10px;
            outline: none;
            -webkit-appearance: none;
            transition: border-color 0.18s, background 0.18s;
        }
        .set-row input::placeholder { color: var(--muted); font-weight: 400; font-size: 0.8rem; text-transform: uppercase; }
        .set-row input:focus {
            border-color: var(--accent);
            background: var(--s3);
        }
        .btn-remove-set {
            width: 36px;
            height: 36px;
            background: none;
            border: 1px solid transparent;
            color: var(--muted2);
            cursor: pointer;
            border-radius: var(--radius);
            font-size: 1.1rem;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.15s, background 0.15s;
        }
        .btn-remove-set:hover, .btn-remove-set:active {
            color: var(--accent-text);
            border-color: var(--accent);
        }
        .btn-remove-set:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .btn-add-set {
            width: 100%;
            min-height: 40px;
            padding: 9px;
            background: var(--s2);
            color: var(--text);
            border: 1px dashed var(--field-border);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.15s, border-color 0.15s;
            margin-top: 2px;
        }
        .btn-add-set:active {
            color: var(--accent-text);
            border-color: var(--accent);
            border-style: solid;
        }

        .sets-header {
            display: grid;
            grid-template-columns: 36px 1fr 1fr 36px;
            gap: 6px;
            margin-bottom: 2px;
        }
        .sets-header span {
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
        }
        .sets-header span:nth-child(2),
        .sets-header span:nth-child(3) { text-align: left; padding-left: 2px; }

        .edit-notice {
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent-text);
            display: none;
        }
        .edit-notice.show { display: block; }

        .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .field label {
            display: block;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .field input, .field textarea {
            width: 100%;
            background: var(--field);
            border: 1px solid var(--field-border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            padding: 10px 12px;
            outline: none;
            -webkit-appearance: none;
            transition: border-color 0.18s, background 0.18s;
        }
        .field input::placeholder, .field textarea::placeholder {
            color: var(--muted2);
            font-weight: 400;
            font-size: 0.85rem;
        }
        .field input:focus, .field textarea:focus {
            border-color: var(--accent);
            background: var(--s3);
        }
        .field textarea {
            resize: none;
            height: 56px;
            font-size: 0.9rem;
        }

        /* ── LOG BUTTON ── */
        .btn-log {
            width: 100%;
            min-height: 52px;
            padding: 13px;
            background: var(--accent);
            color: var(--accent-ink);
            border: none;
            border-radius: var(--radius);
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.16), var(--shadow-sm);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-log:active { opacity: 0.85; transform: scale(0.98); }

        .btn-cancel {
            width: 100%;
            min-height: 40px;
            padding: 10px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            display: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-cancel.show { display: block; }

        /* ── HISTORY ── */
        .history-section { margin-top: 18px; }
        .history-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .history-title {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .history-count {
            background: var(--accent);
            color: var(--accent-ink);
            border-radius: var(--radius);
            padding: 1px 6px;
            font-size: 0.62rem;
            font-weight: 700;
        }

        .history-item {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .h-main { flex: 1; min-width: 0; }
        .h-sets {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            align-items: baseline;
        }
        .h-set {
            display: inline-block;
        }
        .h-set + .h-set::before {
            content: '/';
            color: var(--muted2);
            font-weight: 400;
            margin-right: 8px;
        }
        .h-date {
            font-size: 0.62rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 4px;
        }
        .h-note {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .h-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .btn-icon {
            min-width: 40px;
            height: 36px;
            padding: 0 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border2);
            background: none;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }
        .btn-icon:active { background: var(--s3); color: var(--accent-text); border-color: var(--accent); }

        .no-history {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            color: var(--muted2);
            padding: 4px 2px;
        }

        /* ── DATA SECTION ── */
        .data-section {
            margin: 24px 12px 0;
            background: var(--s1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 14px;
        }
        .data-title {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .data-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-data {
            min-height: 44px;
            padding: 11px;
            background: var(--s2);
            color: var(--text);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .btn-data:active { background: var(--s3); }
        .btn-reset {
            width: 100%;
            min-height: 40px;
            margin-top: 8px;
            padding: 10px;
            background: transparent;
            color: var(--muted2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-reset:active { color: #e24b4a; border-color: rgba(226,75,74,0.4); }

        #fileInput { display: none; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card { animation: fadeUp 0.35s ease both; }

        /* ── STREAK INDICATOR: small square status block ── */
        .streak {
            width: 24px;
            height: 24px;
            border-radius: var(--radius);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border2);
        }
        .streak-core {
            width: 10px;
            height: 10px;
            border-radius: 1px;
            background: var(--muted2);
        }
        .streak.unlogged {
            border-style: dashed;
        }
        .streak.unlogged .streak-core { display: none; }
        .streak.older  .streak-core { background: var(--muted2); opacity: 0.6; }
        .streak.recent .streak-core { background: var(--muted); }
        .streak.week   .streak-core { background: var(--text); }
        .streak.today  { border-color: var(--accent); }
        .streak.today  .streak-core {
            background: var(--accent);
            animation: glow 2.4s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,95,31,0.55); }
            50%      { box-shadow: 0 0 0 4px rgba(255,95,31,0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .streak.today .streak-core { animation: none; }
            .card-body, .card-chevron { transition: none; }
        }

        /* ── PET ROCK: Pebble's unit panel ── */
        .pet-rock {
            position: relative;
            margin: 24px 12px 0;
            padding: 20px 12px 16px;
            text-align: center;
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            color: var(--muted2);
            cursor: pointer;
        }
        .pet-rock::before, .pet-rock::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border: 0 solid var(--accent);
        }
        .pet-rock::before { top: 5px; left: 5px; border-top-width: 1px; border-left-width: 1px; }
        .pet-rock::after  { bottom: 5px; right: 5px; border-bottom-width: 1px; border-right-width: 1px; }
        .pet-rock-face {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text);
            white-space: pre;
            letter-spacing: 0.02em;
            user-select: none;
            transition: color 0.2s, transform 0.1s;
        }
        .pet-rock-face:active { transform: scale(0.96); }
        .pet-rock:hover .pet-rock-face { color: var(--accent-text); }
        .pet-rock-name {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 10px;
        }
        .pet-rock-name::before { content: 'UNIT: '; color: var(--muted2); }
        .pet-rock-mood {
            font-size: 0.66rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent-text);
            margin-top: 4px;
            min-height: 1.2em;
            transition: opacity 0.4s;
        }
        .pet-rock-mood::before { content: 'STATUS: '; color: var(--muted2); }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-top">
            <div class="app-title">my <span class="pop">gym</span><br>coach</div>
            <div class="header-meta">
                <div class="mood-badge" id="moodBadge">loading…</div>
                <button class="theme-toggle" id="themeToggle" onclick="cycleTheme()" aria-label="Change colour theme">THEME: AUTO</button>
            </div>
        </div>
        <div class="header-line"></div>
    </div>

    <div class="card-list" id="app"></div>

    <div class="data-section">
        <div class="data-title">Data &amp; Backups</div>
        <div class="data-btns">
            <button class="btn-data" onclick="backupData()">↓ Backup</button>
            <button class="btn-data" onclick="document.getElementById('fileInput').click()">↑ Restore</button>
        </div>
        <input type="file" id="fileInput" accept=".json" onchange="restoreData(this)">
        <button class="btn-reset" onclick="clearData()">Reset all data</button>
    </div>

    <div class="pet-rock" onclick="petTheRock()">
        <div class="pet-rock-face" id="petFace">( ◕  ◡  ◕ )</div>
        <div class="pet-rock-name">Pebble</div>
        <div class="pet-rock-mood" id="petMood">your accountability rock</div>
    </div>
    <p style="text-align:center; font-size:0.72rem; color:var(--muted2); padding:26px 20px 0; line-height:1.6;">My Gym Coach is a personal project by <a href="https://kmorrison.dev/" style="color:var(--muted);">Katie Morrison</a>, built with AI as a single HTML file. Your data stays in your browser.</p>

    <script>
        const plan = [
            { id: 'leg_press',      name: 'Leg Press',                  instructions: 'Push through heels. Do not lock knees. 3 sets × 10–12 reps.' },
            { id: 'chest_press',    name: 'Dumbbell Chest Press',       instructions: 'Flat bench. Control the weight down slowly. 3 sets × 10–12 reps.' },
            { id: 'seated_row',     name: 'Seated Cable Row',           instructions: 'Pull to belly button. Squeeze shoulder blades. 3 × 10–12.' },
            { id: 'lat_pull',       name: 'Lat Pull Down',              instructions: 'Wide grip to upper chest. Keep torso still. 3 × 10–12.' },
            { id: 'plank',          name: 'Plank',                      instructions: 'Tight core. 3 × 30–45 sec. Enter seconds as weight.' },
            { id: 'calf_raise',     name: 'Standing Calf Raise',        instructions: 'Physio recommended. Rise on toes, lower slowly.' },
            { id: 'leg_ext_left',   name: 'Leg Extension (Left)',       instructions: 'Physio recommended. Left leg only. Control the weight.' },
            { id: 'leg_ext_right',  name: 'Leg Extension (Right)',      instructions: 'Physio recommended. Right leg only. Control the weight.' },
            { id: 'hamstring_curl', name: 'Hamstring Curl',             instructions: 'Physio recommended. Curl heels to glutes.' },
            { id: 'tricep_push',    name: 'Tricep Pushdown',            instructions: 'Cable rope. Keep elbows tucked. Push down and squeeze.' },
            { id: 'bicep_curl',     name: 'Cable Rope Curl',            instructions: 'Keep elbows stable. Curl up, squeeze biceps.' },
            { id: 'pullup',         name: 'Pull-Up (Overhand)',         instructions: 'Park or gym. Wide grip. Enter "BW" for bodyweight.' },
            { id: 'chinup',         name: 'Chin-Up (Underhand)',        instructions: 'Park or gym. Narrow grip. Enter "BW" for bodyweight.' },
            { id: 'shoulder_press_machine', name: 'Shoulder Press Machine', instructions: 'Handles at shoulder height. Press up without locking elbows. 3 × 10–12.' },
            { id: 'lateral_raise',  name: 'Lateral Side Raise',         instructions: 'Dumbbells. Slight bend in elbows. Raise out to shoulder height, lower slowly. 3 × 10–12.' },
            { id: 'front_raise',    name: 'Front Raise',                instructions: 'Dumbbells. Raise in front to shoulder height. No swinging. 3 × 10–12.' },
            { id: 'chest_press_machine', name: 'Chest Press Machine',   instructions: 'Handles at mid-chest. Push out, control the return. 3 × 10–12.' },
            { id: 'db_shoulder_press', name: 'Dumbbell Shoulder Press', instructions: 'Seated, back supported. Press overhead, lower to ear height. 3 × 10–12.' }
        ];

        const moods = [
            "let's get moving 🚀", "you showed up ✓", "one rep at a time",
            "no pressure, just progress", "today counts 💪", "good things take time",
            "moving is medicine", "slow is smooth", "here we go ✦"
        ];

        let workouts = JSON.parse(localStorage.getItem('gymWorkouts')) || [];
        let editIndex = null;
        let openCards = {};
        let formSets = {};

        function migrate() {
            let migrated = false;
            workouts = workouts.map(w => {
                if (w.sets) return w;
                migrated = true;
                return {
                    id: w.id,
                    name: w.name,
                    date: w.date,
                    note: w.note || '',
                    sets: [{ weight: w.weight, reps: w.reps }]
                };
            });
            if (migrated) localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
        }
        migrate();

        function getFormSets(id) {
            if (!formSets[id]) formSets[id] = [{ weight: '', reps: '' }];
            return formSets[id];
        }

        document.getElementById('moodBadge').textContent =
            moods[Math.floor(Math.random() * moods.length)];

        // Theme: AUTO follows the phone, DARK and LIGHT override it.
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') || 'auto';
        }
        function labelTheme() {
            document.getElementById('themeToggle').textContent = 'THEME: ' + currentTheme().toUpperCase();
        }
        function cycleTheme() {
            const order = ['auto', 'dark', 'light'];
            const next = order[(order.indexOf(currentTheme()) + 1) % order.length];
            if (next === 'auto') {
                document.documentElement.removeAttribute('data-theme');
                try { localStorage.removeItem('gymTheme'); } catch (e) {}
            } else {
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('gymTheme', next); } catch (e) {}
            }
            labelTheme();
        }
        labelTheme();

        function updatePetRock() {
            const face = document.getElementById('petFace');
            const mood = document.getElementById('petMood');
            if (workouts.length === 0) {
                face.textContent = '( ·  ‿  · )';
                mood.textContent = "we haven't met yet";
                return;
            }
            const lastDate = new Date(workouts[workouts.length - 1].date);
            const daysSince = Math.floor((Date.now() - lastDate.getTime()) / 86400000);
            if (daysSince === 0) {
                face.textContent = '( ◕  ◡  ◕ )';
                mood.textContent = "proud of you today";
            } else if (daysSince <= 2) {
                face.textContent = '( ◠  ‿  ◠ )';
                mood.textContent = "still feeling good";
            } else if (daysSince <= 6) {
                face.textContent = '( ·  _  · )';
                mood.textContent = "ready when you are";
            } else if (daysSince <= 14) {
                face.textContent = '( -  _  - )';
                mood.textContent = "a little sleepy…";
            } else {
                face.textContent = '( ╥  _  ╥ )';
                mood.textContent = "missing you";
            }
        }

        const petPats = [
            "thank you", "that tickles", "good rock?",
            "ahhh", "10/10 pat", "i felt that", "✦", "purr",
            "rocks can't actually purr", "you're doing great"
        ];
        let petTimer;
        function petTheRock() {
            const mood = document.getElementById('petMood');
            mood.style.opacity = '0';
            clearTimeout(petTimer);
            setTimeout(() => {
                mood.textContent = petPats[Math.floor(Math.random() * petPats.length)];
                mood.style.opacity = '1';
            }, 200);
            petTimer = setTimeout(updatePetRock, 2400);
        }

        updatePetRock();

        function toggleCard(id) {
            openCards[id] = !openCards[id];
            render();
        }

        function fmtDate(iso) {
            return new Date(iso).toLocaleDateString('en-GB', {
                day: 'numeric', month: 'short', year: 'numeric'
            });
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            plan.forEach((ex, idx) => {
                const isOpen = !!openCards[ex.id];
                const history = workouts
                    .map((w, i) => ({ ...w, origIdx: i }))
                    .filter(w => w.id === ex.id)
                    .reverse();
                const last = history[0] || null;
                const isEditing = editIndex !== null && workouts[editIndex]?.id === ex.id;

                const daysSince = last
                    ? Math.floor((Date.now() - new Date(last.date).getTime()) / 86400000)
                    : null;

                let streakClass = 'unlogged';
                if (daysSince === null)         streakClass = 'unlogged';
                else if (daysSince === 0)       streakClass = 'today';
                else if (daysSince <= 7)        streakClass = 'week';
                else if (daysSince <= 21)       streakClass = 'recent';
                else                            streakClass = 'older';

                const streakHTML = `<div class="streak ${streakClass}"><span class="streak-core"></span></div>`;

                const formatSet = s => `${s.weight} × ${s.reps}`;
                const lastStr = last
                    ? `last: <span class="val">${last.sets.map(formatSet).join(' · ')}</span>`
                    : 'nothing logged yet';

                // Hero number: the heaviest set from last session (falls back to the first set for "BW" etc.)
                const topSet = last
                    ? last.sets.reduce((best, s) =>
                        (parseFloat(s.weight) || 0) > (parseFloat(best.weight) || 0) ? s : best, last.sets[0])
                    : null;
                const heroLong = topSet && String(topSet.weight).length > 4 ? ' long' : '';

                const bestHTML = last ? `
                    <div class="best-box">
                        <div class="best-side">${ex.name}</div>
                        <div class="best-text">
                            <div class="best-label">Last session // ${fmtDate(last.date)}</div>
                            <div class="best-hero${heroLong}">${topSet.weight}<span class="best-unit">× ${topSet.reps}</span></div>
                            <div class="best-val">${last.sets.map(s => `<span class="best-set">${formatSet(s)}</span>`).join('')}</div>
                            <div class="best-date">Try to nudge it up</div>
                        </div>
                    </div>` : '';

                const sets = isEditing
                    ? workouts[editIndex].sets.map(s => ({...s}))
                    : getFormSets(ex.id);
                const nVal = isEditing
                    ? (workouts[editIndex].note || '')
                    : '';
                const btnLabel = isEditing ? 'Update session' : 'Save session ✦';

                const setsHTML = sets.map((s, i) => `
                    <div class="set-row">
                        <div class="set-num">${i + 1}</div>
                        <input type="text" placeholder="weight" value="${s.weight}"
                               oninput="updateSet('${ex.id}', ${i}, 'weight', this.value, ${isEditing})"
                               onclick="event.stopPropagation()">
                        <input type="number" placeholder="reps" value="${s.reps}"
                               oninput="updateSet('${ex.id}', ${i}, 'reps', this.value, ${isEditing})"
                               onclick="event.stopPropagation()">
                        <button class="btn-remove-set" onclick="removeSet('${ex.id}', ${i}, ${isEditing})"
                                ${sets.length === 1 ? 'disabled' : ''}>×</button>
                    </div>`).join('');

                let histHTML = '';
                if (history.length === 0) {
                    histHTML = '<div class="no-history">Nothing here yet. Go first!</div>';
                } else {
                    histHTML = history.map(item => {
                        const noteStr = item.note ? `<div class="h-note">${item.note}</div>` : '';
                        const setsStr = item.sets.map(s =>
                            `<span class="h-set">${formatSet(s)}</span>`
                        ).join('');
                        return `<div class="history-item">
                            <div class="h-main">
                                <div class="h-sets">${setsStr}</div>
                                <div class="h-date">${fmtDate(item.date)}</div>
                                ${noteStr}
                            </div>
                            <div class="h-actions">
                                <button class="btn-icon" onclick="startEdit(${item.origIdx},'${ex.id}')" aria-label="Edit this session">EDIT</button>
                                <button class="btn-icon" onclick="deleteEntry(${item.origIdx})" aria-label="Delete this session">DEL</button>
                            </div>
                        </div>`;
                    }).join('');
                }

                const card = document.createElement('div');
                card.className = 'card' + (isOpen ? ' open' : '');
                card.style.animationDelay = `${idx * 25}ms`;
                card.setAttribute('data-card-id', ex.id);

                card.innerHTML = `
                    <div class="card-header" onclick="toggleCard('${ex.id}')">
                        ${streakHTML}
                        <div class="card-label">
                            <div class="card-name">${ex.name}</div>
                            <div class="card-last">${lastStr}</div>
                        </div>
                        <span class="card-chevron">▾</span>
                    </div>
                    <div class="card-body ${isOpen ? 'open' : ''}">
                        <div class="card-inner">
                            <div class="instructions">${ex.instructions}</div>
                            ${bestHTML}
                            <div class="log-form">
                                <div class="edit-notice ${isEditing ? 'show' : ''}">Editing a previous session. Change what you need and save.</div>
                                <div class="sets-header">
                                    <span>Set</span>
                                    <span>Weight / Secs</span>
                                    <span>Reps</span>
                                    <span></span>
                                </div>
                                <div class="sets-list">${setsHTML}</div>
                                <button class="btn-add-set" onclick="addSet('${ex.id}', ${isEditing})">+ Add another set</button>
                                <div class="field" style="margin-top: 6px;">
                                    <label>Notes</label>
                                    <textarea id="n_${ex.id}" placeholder="How did it feel?" onclick="event.stopPropagation()">${nVal}</textarea>
                                </div>
                                <button class="btn-log" onclick="saveWorkout('${ex.id}','${ex.name}')">${btnLabel}</button>
                                <button class="btn-cancel ${isEditing ? 'show' : ''}" onclick="cancelEdit('${ex.id}')">Cancel</button>
                            </div>
                            <div class="history-section">
                                <div class="history-header">
                                    <div class="history-title">Session history</div>
                                    ${history.length > 0 ? `<span class="history-count">${history.length}</span>` : ''}
                                </div>
                                ${histHTML}
                            </div>
                        </div>
                    </div>
                `;

                app.appendChild(card);
            });
        }

        function updateSet(exId, setIdx, field, value, isEditing) {
            if (isEditing && editIndex !== null) {
                workouts[editIndex].sets[setIdx][field] = value;
            } else {
                getFormSets(exId)[setIdx][field] = value;
            }
        }

        function addSet(exId, isEditing) {
            const sets = isEditing && editIndex !== null
                ? workouts[editIndex].sets
                : getFormSets(exId);
            sets.push({ weight: '', reps: '' });
            openCards[exId] = true;
            render();
            setTimeout(() => {
                const card = document.querySelector(`[data-card-id="${exId}"]`);
                if (!card) return;
                const inputs = card.querySelectorAll('.set-row input[type="text"]');
                inputs[inputs.length - 1]?.focus({ preventScroll: true });
            }, 60);
        }

        function removeSet(exId, setIdx, isEditing) {
            const sets = isEditing && editIndex !== null
                ? workouts[editIndex].sets
                : getFormSets(exId);
            if (sets.length <= 1) return;
            sets.splice(setIdx, 1);
            openCards[exId] = true;
            render();
        }

        function saveWorkout(id, name) {
            const note = document.getElementById(`n_${id}`).value.trim();
            const isEditing = editIndex !== null && workouts[editIndex]?.id === id;
            const sets = isEditing
                ? workouts[editIndex].sets
                : getFormSets(id);

            const validSets = sets
                .map(s => ({ weight: (s.weight || '').toString().trim(), reps: (s.reps || '').toString().trim() }))
                .filter(s => s.weight && s.reps);

            if (validSets.length === 0) {
                alert('Please enter weight and reps for at least one set.');
                return;
            }

            if (isEditing) {
                workouts[editIndex].sets = validSets;
                workouts[editIndex].note = note;
                editIndex = null;
                editSnapshot = null;
            } else {
                workouts.push({
                    id, name,
                    date: new Date().toISOString(),
                    note,
                    sets: validSets
                });
                formSets[id] = [{ weight: '', reps: '' }];
            }
            localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
            openCards[id] = true;
            render();
            updatePetRock();
        }

        function deleteEntry(index) {
            if (confirm('Delete this entry?')) {
                workouts.splice(index, 1);
                if (editIndex === index) editIndex = null;
                localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
                render();
                updatePetRock();
            }
        }

        let editSnapshot = null;

        function startEdit(index, id) {
            editIndex = index;
            editSnapshot = JSON.stringify(workouts[index]);
            openCards[id] = true;
            render();
        }

        function cancelEdit(id) {
            if (editSnapshot && editIndex !== null) {
                workouts[editIndex] = JSON.parse(editSnapshot);
            }
            editIndex = null;
            editSnapshot = null;
            openCards[id] = true;
            render();
        }

        function clearData() {
            if (confirm('Delete all history? This cannot be undone without a backup.')) {
                localStorage.removeItem('gymWorkouts');
                workouts = []; editIndex = null; openCards = {};
                render();
                updatePetRock();
            }
        }

        function backupData() {
            const uri = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(workouts));
            const a = document.createElement('a');
            a.href = uri;
            a.download = 'gym-backup-' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
        }

        function restoreData(el) {
            const file = el.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error('Invalid format');
                    if (confirm('Replace current history with backup data?')) {
                        workouts = data;
                        localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
                        openCards = {}; editIndex = null;
                        render();
                        updatePetRock();
                        alert('Data restored successfully.');
                    }
                } catch(err) { alert('Could not read backup: ' + err.message); }
            };
            reader.readAsText(file);
            el.value = '';
        }

        render();
    </script>
</body>
</html>
